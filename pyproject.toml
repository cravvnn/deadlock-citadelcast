[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-citadelcast"
version = "0.2.0.dev0"
description = "Camera controls and broadcast tools for live Deadlock matches"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
dependencies = []

[project.scripts]
deadlock-citadelcast = "dolly_live.desk:main"

[tool.setuptools.packages.find]
include = ["dolly_live*"]
